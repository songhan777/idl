name: Contract checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full commit SHAs were resolved from the official release pages.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install fixed Python validation dependencies
        run: python -m pip install -r requirements-contract.lock
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Validate OpenAPI and examples
        run: python scripts/verify_contract.py
      - name: Test verifier regression cases
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install fixed package manager
        run: npm install --global pnpm@11.19.0
      - name: Install JavaScript dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint, generated-code drift, types and client tests
        run: pnpm validate
      # Static checks only. Add a real released-contract compatibility comparison,
      # provider/consumer integration tests and security/load gates before release.
      # This workflow intentionally contains no publish or deploy credentials.
